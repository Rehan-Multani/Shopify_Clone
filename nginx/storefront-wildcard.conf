# ============================================================
# STOREFRONT WILDCARD CONFIG
# File: /etc/nginx/sites-available/storefront-wildcard.conf
#
# PURPOSE:
#   Serves admin-frontend/dist (React SPA) for ANY custom
#   merchant domain pointing to this server's IP.
#   Backend stays unchanged — only static files served here.
#
# DEPLOY ONCE:
#   sudo ln -s /etc/nginx/sites-available/storefront-wildcard.conf \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo nginx -s reload
# ============================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    # Catch-all: any domain not matched by other server blocks
    # e.g. fashion.cloudedata.com, rehanstore.com, etc.
    server_name _;

    # ─── FRONTEND (Static React Build) ────────────────────────
    # Same dist folder used for admin panel storefront preview
    root /var/www/admin-frontend/dist;
    index index.html;

    # React Router SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── BACKEND PROXY (Already Deployed Gateway) ─────────────
    # Backend runs separately on port 5000 — we just proxy here
    # No backend deployment needed per domain!
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # ─── UPLOADS (Shared Gateway Folder) ──────────────────────
    location /uploads/ {
        alias /var/www/Shopify_Clone/services/gateway/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ─── SECURITY HEADERS ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ─── GZIP ─────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
