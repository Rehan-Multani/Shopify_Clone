server {
    listen 80;
    server_name api.storify.cloudedata.in;

    # 1. API Gateway Proxy (Port 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Images/files upload size limits
        client_max_body_size 25M;
    }

    # 2. Uploaded Media static files (Directly served by Nginx for high speed)
    location /uploads/ {
        alias /var/www/Shopify_Clone/services/gateway/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Redirect logs
    access_log /var/log/nginx/storify-backend-access.log;
    error_log /var/log/nginx/storify-backend-error.log;
}
