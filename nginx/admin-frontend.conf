server {
    listen 80;
    server_name admin.cloudedata.in;

    # 1. FRONTEND: Merchant Admin Panel Static Files
    root /var/www/Shopify_Clone/admin-frontend/dist;
    index index.html;

    # React Router routes support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. BACKEND: API Gateway Proxy (Port 5000)
    location /api {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        client_max_body_size 25M;
    }

    # 3. STATIC UPLOADS: Serve uploaded files directly via Nginx
    location /uploads/ {
        alias /var/www/Shopify_Clone/services/gateway/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Redirect logs
    access_log /var/log/nginx/storify-admin-access.log;
    error_log /var/log/nginx/storify-admin-error.log;
}
